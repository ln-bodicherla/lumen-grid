# Lumen: lock field is an amber light line that ignites cyan while you type.
[lock]
background       = "#0d0d0d"
background-alpha = 0.8
text             = "#fbecc4"
placeholder      = "#7f6f45"
text-error       = "#e06c75"
border           = "#F2C13C"
border-active    = "#8ED7E6"
border-error     = "#e06c75"
border-alpha     = 1.0
selection        = "#F2C13C"
selection-alpha  = 0.45
