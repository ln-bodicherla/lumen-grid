# Lumen: menu card in dark glass; the selected row is lit in amber.
[menu]
background                = "#0d0d0d"
background-alpha          = 0.95
text                      = "#fbecc4"
border                    = "#F2C13C"
border-alpha              = 0.9
scrim                     = "#000000"
scrim-alpha               = 0.55
selected-background       = "#F2C13C"
selected-background-alpha = 0.10
selected-text             = "#F2C13C"
selected-border           = "#F2C13C"
selected-border-alpha     = 0.85
