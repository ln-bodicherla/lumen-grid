# Lumen: HUD bar. Near-black panel, cyan readouts, orange for anything calling for attention.
[bar]
background       = "#171717"  # matches the wallpaper's top edge so the bar blends in
background-alpha = 1.0
text             = "#8ED7E6"
active           = "#d19a66"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
