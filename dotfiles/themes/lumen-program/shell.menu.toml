# Lumen: menu card in dark glass; the selected row is lit in cyan.
[menu]
background                = "#0d0d0d"
background-alpha          = 0.95
text                      = "#d6f4fa"
border                    = "#8ED7E6"
border-alpha              = 0.9
scrim                     = "#000000"
scrim-alpha               = 0.55
selected-background       = "#8ED7E6"
selected-background-alpha = 0.10
selected-text             = "#8ED7E6"
selected-border           = "#8ED7E6"
selected-border-alpha     = 0.85
