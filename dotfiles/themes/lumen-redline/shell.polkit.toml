# Lumen: password prompts match the lock screen.
[polkit]
background       = "#0d0d0d"
background-alpha = 0.97
text             = "#fbc2be"
text-error       = "#e060bf"
border           = "#F2372A"
border-error     = "#e060bf"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 0.55
accent           = "#85E6B6"
