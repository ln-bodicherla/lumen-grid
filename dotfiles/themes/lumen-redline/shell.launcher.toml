# Lumen: launcher card in dark glass; the selected row is lit in amber.
[launcher]
background                = "#0d0d0d"
background-alpha          = 0.95
text                      = "#fbc2be"
border                    = "#F2372A"
border-alpha              = 0.9
scrim                     = "#000000"
scrim-alpha               = 0.55
selected-background       = "#F2372A"
selected-background-alpha = 0.10
selected-text             = "#F2372A"
selected-border           = "#F2372A"
selected-border-alpha     = 0.85
