# Lumen HUD prompt: light disc, folder, chevron. The clock is a Nerd Font glyph (U+F017).
# Colors are the terminal's named ANSI colors, which Omarchy
# sets from the theme, so Program (cyan) / Overload (amber) switching carries over.
add_newline = true
command_timeout = 200
format = "[◉ ](bold cyan)$directory$git_branch$git_status$cmd_duration$character"

[character]
success_symbol = "[ ❯](bold cyan)"
error_symbol = "[ ❯](bold red)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style)"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
read_only = " ⊘"

[git_branch]
format = " [⟨$branch⟩]($style)"
style = "cyan dimmed"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "yellow"
ahead      = " ⇡${count}"
diverged   = " ⇕⇡${ahead_count}⇣${behind_count}"
behind     = " ⇣${count}"
conflicted = " ✕"
up_to_date = ""
untracked  = " ?"
modified   = " ●"
stashed    = ""
staged     = " +"
renamed    = ""
deleted    = " −"

# Slow commands get a timing readout.
[cmd_duration]
min_time = 2000
format = " [ $duration]($style)"
style = "cyan dimmed"
