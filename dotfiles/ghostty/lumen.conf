# Lumen: light-cycle cursor trail (shader regenerated in the theme accent on every theme switch)
custom-shader = ~/.config/ghostty/shaders/lumen-trail.glsl
custom-shader-animation = true
# Lumen: display glow (bloom; scanlines on Overload / Redline), regenerated on every theme switch
custom-shader = ~/.config/ghostty/shaders/lumen-glow.glsl
