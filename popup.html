<!doctype html>
<html><head><meta charset="utf-8"><title>Lumen Grid</title>
<style>
  html, body { overflow-x: hidden; }
  body { margin: 0; width: 260px; padding: 16px; background: #02080d; color: #bffcff;
         font: 500 12px/1.4 ui-monospace, "JetBrains Mono", monospace; letter-spacing: .06em;
         background-image: linear-gradient(rgba(0,240,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,240,255,.06) 1px, transparent 1px);
         background-size: 24px 24px; }
  h1 { margin: 0 0 14px; font-size: 14px; letter-spacing: .35em; color: #00f0ff; text-shadow: 0 0 10px #00f0ff; }
  label { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,240,255,.2); cursor: pointer; }
  input[type=checkbox] { appearance: none; width: 34px; height: 16px; border: 1px solid #00f0ff; position: relative; cursor: pointer; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; background: rgba(0,240,255,.4); transition: .2s; }
  input[type=checkbox]:checked::after { left: 20px; background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
  input[type=number] { width: 38px; background: #02080d; color: #00f0ff; border: 1px solid rgba(0,240,255,.5); font: inherit; padding: 2px 3px; }
  select { background: #02080d; color: #00f0ff; border: 1px solid #00f0ff; font: inherit; padding: 3px; }
  input[type=range] { width: 110px; accent-color: #00f0ff; }
  button { width: 100%; margin-top: 14px; padding: 9px; background: transparent; color: #00f0ff; border: 1px solid #00f0ff;
           font: inherit; letter-spacing: .25em; cursor: pointer; }
  button:hover { background: #00f0ff; color: #001014; box-shadow: 0 0 16px #00f0ff; }
  small { display: block; margin-top: 12px; opacity: .6; }
  h2 { margin: 18px 0 6px; font-size: 11px; letter-spacing: .3em; color: #00f0ff; }
  #site { margin-top: 6px; }
  #site.on { color: #ff9a3c; border-color: #ff9a3c; }
  #site.on:hover { background: #ff9a3c; color: #140a00; box-shadow: 0 0 16px #ff9a3c; }
  #status { margin-top: 6px; min-height: 1em; color: #ff9a3c; opacity: .9; word-break: break-all; }
  textarea { box-sizing: border-box; width: 100%; height: 96px; margin-top: 6px; resize: vertical; background: #02080d; color: #bffcff;
             border: 1px solid rgba(0,240,255,.4); font: 11px/1.5 ui-monospace, "JetBrains Mono", monospace; padding: 6px; }
  textarea:focus { outline: none; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,.35); }
</style></head>
<body>
  <h1>◆ LUMEN FOCUS</h1>
  <label>Style <select id="style"><option value="inplace">In place</option><option value="popout">Pop out</option></select></label>
  <label>Auto-focus videos <input type="checkbox" id="auto"></label>
  <label>Lumen theme (all sites) <input type="checkbox" id="lumen"></label>
  <label>Live background <input type="checkbox" id="wall"></label>
  <label>Dim <input type="range" id="dim" min="0" max="0.8" step="0.01"></label>
  <label>Screen corners (fullscreen) <span><input type="number" id="scrTop" min="0" max="80" title="top corners, px"> <input type="number" id="scrBottom" min="0" max="80" title="bottom corners, px"></span></label>
  <button id="go">FOCUS VIDEO NOW</button>
  <h2>BYPASS</h2>
  <button id="site">BYPASS THIS SITE</button>
  <div id="status"></div>
  <textarea id="bypass" spellcheck="false" placeholder="one per line&#10;github.com&#10;mail.google.com/*&#10;*.example.org"></textarea>
  <small>Domains include subdomains · URL patterns use * · # comments<br>Alt+Shift+F focus · Alt+Shift+T theme · Esc exit<br>Fullscreen: Alt+Shift+↑↓ top corners, ←→ bottom</small>
  <script src="bypass.js"></script>
  <script src="popup.js"></script>
</body></html>
